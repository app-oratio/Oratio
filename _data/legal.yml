labels:
  privacy:
    singular: "Política de Privacidade"
    plural: "Políticas de Privacidade"
    selector_title: "Escolha a Política de Privacidade"
    selector_description: "O Site e o aplicativo Android possuem operações diferentes e, por isso, cada ambiente apresenta uma política própria, com escopo, dados e serviços externos descritos separadamente."
  terms:
    singular: "Termos de Uso"
    plural: "Termos de Uso"
    selector_title: "Escolha os Termos de Uso"
    selector_description: "Consulte o documento correspondente ao ambiente utilizado, pois as regras do portal web não são idênticas às condições aplicáveis ao aplicativo Android."

environments:
  site:
    label: "Site"
    eyebrow: "Portal web"
    description: "Documentos aplicáveis à navegação no portal, ao formulário de contato, ao armazenamento local do navegador e aos serviços utilizados pelo site."
  app:
    label: "App Android"
    eyebrow: "Aplicativo móvel"
    description: "Documentos aplicáveis à instalação e ao uso do Oratio para Android, incluindo dados locais, permissões, notificações, serviços da plataforma e atualizações do aplicativo."

