{% assign analytics = site.data.analytics %}
{% if jekyll.environment == 'production' and analytics.enabled and analytics.measurement_id %}
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ analytics.measurement_id | url_encode }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];

  function gtag() {
    dataLayer.push(arguments);
  }

  gtag('js', new Date());
  gtag('config', {{ analytics.measurement_id | jsonify }});
</script>
{% endif %}
