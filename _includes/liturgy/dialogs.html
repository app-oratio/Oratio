<style>
  /*
   * Mantém o cabeçalho do diálogo visível e limita a rolagem ao conteúdo.
   * O seletor [open] evita que display:flex torne o <dialog> visível quando fechado.
   */
  dialog.liturgy-dialog[open] {
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    width: min(92vw, 46rem);
    max-width: 46rem;
    max-height: min(88dvh, 56rem);
    margin: auto;
    padding: 0;
    overflow: hidden;
  }

  dialog.liturgy-dialog::backdrop {
    background: rgba(0, 0, 0, 0.58);
  }

  .liturgy-dialog__header {
    position: relative;
    z-index: 1;
    display: flex;
    flex: 0 0 auto;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border-color, rgba(127, 127, 127, 0.3));
    background: var(--surface-color, var(--background-color, Canvas));
  }

  .liturgy-dialog__header h2 {
    margin: 0;
  }

  .liturgy-dialog__content {
    flex: 1 1 auto;
    min-height: 0;
    padding: 1.25rem;
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-gutter: stable;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
  }

  /* Classe controlada pelo script abaixo enquanto algum diálogo litúrgico está aberto. */
  html.liturgy-dialog-scroll-locked,
  body.liturgy-dialog-scroll-locked {
    overflow: hidden;
    overscroll-behavior: none;
  }

  @media (max-width: 40rem) {
    dialog.liturgy-dialog[open] {
      width: calc(100vw - 1rem);
      max-width: calc(100vw - 1rem);
      max-height: calc(100dvh - 1rem);
    }

    .liturgy-dialog__header {
      padding: 0.875rem 1rem;
    }

    .liturgy-dialog__content {
      padding: 1rem;
    }
  }
</style>

<dialog class="liturgy-dialog" data-liturgy-dialog aria-labelledby="liturgy-dialog-title">
  <div class="liturgy-dialog__header">
    <h2 id="liturgy-dialog-title" data-liturgy-dialog-title></h2>
    <button class="icon-button" type="button" data-liturgy-dialog-close aria-label="Fechar">×</button>
  </div>
  <div class="liturgy-dialog__content" data-liturgy-dialog-content></div>
</dialog>

<template data-liturgy-dialog-template="pai-nosso" data-title="Pai-Nosso">
  <p>Pai nosso que estais nos céus, santificado seja o vosso nome; venha a nós o vosso reino, seja feita a vossa vontade, assim na terra como no céu.</p>
  <p>O pão nosso de cada dia nos dai hoje; perdoai-nos as nossas ofensas, assim como nós perdoamos a quem nos tem ofendido; e não nos deixeis cair em tentação, mas livrai-nos do mal. Amém.</p>
</template>

<template data-liturgy-dialog-template="exame-de-consciencia" data-title="Exame de consciência">
  <h3 style="color: red">EXAME DE CONSCIÊNCIA</h3>

  <h4 style="color: red">✠&nbsp;&nbsp;Ato de presença de Deus&nbsp;&nbsp;✠</h4>
  <p>
    Meu Deus, dai-me luz para conhecer os pecados que hoje cometi, as suas causas e os meios de os evitar.
  </p>

  <h4 style="color: red">✠&nbsp;&nbsp;Exame de consciência&nbsp;&nbsp;✠</h4>
  <p><b>Deveres para com Deus:</b><br>
    Comecei o dia oferecendo a Deus todos os meus pensamentos, palavras e ações?<br>
    Fiz algumas outras orações durante o dia, agradecendo, pedindo, oferecendo a Deus o trabalho bem feito, aceitando com fé os sofrimentos e contrariedades, etc.?<br>
    Procurei viver a fé e cumprir com os preceitos da Igreja?<br>
    Caí em alguma prática supersticiosa?<br>
    Fiz alguns pequenos sacrifícios ao comer, ao beber, nas conversas, na guarda da vista pela rua?
  </p>

  <p><b>Deveres para com o próximo:</b><br>
    Tratei os outros com compreensão e paciência?<br>
    Manifestei-lhes aversão, desprezo ou irritação?<br>
    Tive inveja?<br>
    Falei mal da vida alheia, divulgando defeitos ou pecados dos outros?<br>
    Fui egoísta, pensando só nas atenções que os outros deveriam dar-me, e esquecendo-me de ser prestativo, generoso e dedicado?<br>
    Admiti sentimentos de ódio, rancor ou vingança?<br>
    Magoei alguém com brincadeiras e comentários humilhantes?<br>
    Procurei prestar pequenos serviços aos demais?<br>
    Fiz o possível por auxiliar os que precisavam de uma ajuda material ou espiritual, sobretudo no trabalho e em casa?<br>
    Rezei pelos outros e procurei aproximar algum amigo de Deus?
  </p>

  <p><b>Deveres para comigo:</b><br>
    Esforcei-me por melhorar hoje em alguma virtude, especialmente naquelas em que tenho mais dificuldades?<br>
    Procurei cumprir com perfeição os meus deveres familiares e profissionais, lutando contra a preguiça, o desleixo, a desordem, o adiamento?<br>
    Evitei pensamentos, palavras ou atos de orgulho, vaidade, preguiça, sensualidade ou avareza?<br>
    Deixei-me arrastar pela curiosidade sensual e por desejos impuros?<br>
    Fui insincero?
  </p>

  <h4 style="color: red">✠&nbsp;&nbsp;Ato de contrição&nbsp;&nbsp;✠</h4>
  <p>
    Meu Deus, porque sois tão bom, arrependo-me de vos ter ofendido. Ajudai-me a não tornar a pecar.
  </p>
</template>

<template data-liturgy-dialog-template="ato-penitencial" data-title="Ato penitencial">
  <h3>FÓRMULAS DO ATO PENITENCIAL</h3>
  <h4>NAS COMPLETAS</h4>

  <p class="rub">1. Após breve silêncio, todos juntos confessam, dizendo:</p>
  <p>Confesso a Deus todo-poderoso<br>
    e a vós, irmãos e irmãs,<br>
    que pequei muitas vezes<br>
    por pensamentos e palavras,<br>
    atos e omissões,</p>

  <p class="rub">e batendo no peito, dizem:</p>
  <p>por minha culpa, minha culpa, minha tão grande culpa.</p>

  <p class="rub">Em seguida, continuam:</p>
  <p>E peço à Virgem Maria,<br>
    aos Anjos e Santos,<br>
    e a vós, irmãos e irmãs,<br>
    que rogueis por mim a Deus, nosso Senhor.</p>

  <p class="rub">Segue-se a absolvição de quem preside:</p>
  <p>Deus todo-poderoso tenha compaixão de nós,<br>
    perdoe os nossos pecados<br>
    e nos conduza à vida eterna.</p>
  <p><strong>Todos:</strong><br>
    Amém.</p>

  <p class="rub">2. Ou, quem preside diz:</p>
  <p><strong>Quem preside:</strong><br>
    Tende compaixão de nós, Senhor.</p>
  <p><strong>Todos:</strong><br>
    Porque somos pecadores.</p>
  <p><strong>Quem preside:</strong><br>
    Manifestai, Senhor, a vossa misericórdia.</p>
  <p><strong>Todos:</strong><br>
    E dai-nos a vossa salvação.</p>

  <p class="rub">Segue-se a absolvição de quem preside:</p>
  <p>Deus todo-poderoso tenha compaixão de nós,<br>
    perdoe os nossos pecados<br>
    e nos conduza à vida eterna.</p>
  <p><strong>Todos:</strong><br>
    Amém.</p>

  <p class="rub">3. Ou: Quem preside ou outra pessoa designada propõe as seguintes invocações ou outras semelhantes com<br>
    <i>Kyrie eléison</i> (Senhor, tende piedade de nós):</p>
  <p><strong>Quem preside:</strong><br>
    Senhor, que viestes salvar os corações arrependidos,<br>
    tende piedade de nós.</p>
  <p><strong>Todos:</strong><br>
    Senhor, tende piedade de nós (<i>Kyrie eléison</i>).</p>
  <p><strong>Quem preside:</strong><br>
    Cristo, que viestes chamar os pecadores,<br>
    tende piedade de nós.</p>
  <p><strong>Todos:</strong><br>
    Cristo, tende piedade de nós (<i>Christe eléison</i>).</p>
  <p><strong>Quem preside:</strong><br>
    Senhor, que intercedeis por nós junto do Pai,<br>
    tende piedade de nós.</p>
  <p><strong>Todos:</strong><br>
    Senhor, tende piedade de nós (<i>Kyrie eléison</i>).</p>

  <p class="rub">Segue-se a absolvição de quem preside:</p>
  <p>Deus todo-poderoso tenha compaixão de nós,<br>
    perdoe os nossos pecados<br>
    e nos conduza à vida eterna.</p>
  <p><strong>Todos:</strong><br>
    Amém.</p>
</template>

<script>
  (() => {
    const dialogs = Array.from(document.querySelectorAll('[data-liturgy-dialog]'));

    if (!dialogs.length) return;

    const html = document.documentElement;
    const body = document.body;
    let isLocked = false;
    let savedScrollY = 0;
    let previousBodyStyles = null;
    let previousHtmlOverflow = '';

    const anyDialogIsOpen = () => dialogs.some((dialog) => dialog.open);

    const lockPageScroll = () => {
      if (isLocked) return;

      savedScrollY = window.scrollY || window.pageYOffset || 0;
      previousHtmlOverflow = html.style.overflow;
      previousBodyStyles = {
        position: body.style.position,
        top: body.style.top,
        left: body.style.left,
        right: body.style.right,
        width: body.style.width,
        overflow: body.style.overflow,
        paddingRight: body.style.paddingRight
      };

      const scrollbarWidth = Math.max(0, window.innerWidth - html.clientWidth);

      html.classList.add('liturgy-dialog-scroll-locked');
      body.classList.add('liturgy-dialog-scroll-locked');
      html.style.overflow = 'hidden';
      body.style.position = 'fixed';
      body.style.top = `-${savedScrollY}px`;
      body.style.left = '0';
      body.style.right = '0';
      body.style.width = '100%';
      body.style.overflow = 'hidden';

      if (scrollbarWidth > 0) {
        body.style.paddingRight = `${scrollbarWidth}px`;
      }

      isLocked = true;
    };

    const unlockPageScroll = () => {
      if (!isLocked || !previousBodyStyles) return;

      html.classList.remove('liturgy-dialog-scroll-locked');
      body.classList.remove('liturgy-dialog-scroll-locked');
      html.style.overflow = previousHtmlOverflow;

      Object.entries(previousBodyStyles).forEach(([property, value]) => {
        body.style[property] = value;
      });

      isLocked = false;
      previousBodyStyles = null;
      window.scrollTo(0, savedScrollY);
    };

    const synchronizeScrollLock = () => {
      if (anyDialogIsOpen()) {
        lockPageScroll();
      } else {
        unlockPageScroll();
      }
    };

    dialogs.forEach((dialog) => {
      const observer = new MutationObserver(synchronizeScrollLock);
      observer.observe(dialog, {
        attributes: true,
        attributeFilter: ['open']
      });

      dialog.addEventListener('close', synchronizeScrollLock);
      dialog.addEventListener('cancel', () => {
        requestAnimationFrame(synchronizeScrollLock);
      });
    });

    window.addEventListener('pagehide', unlockPageScroll, { once: true });
    synchronizeScrollLock();
  })();
</script>
